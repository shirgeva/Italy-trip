<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="description" content="Italy 2026 personal road trip planner" />
  <title>Italy 2026 · Road Trip Planner</title>
  <style>
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #FAFAF9;
  --surface-3: #F4F3F1;
  --surface-soft: #FCFCFB;
  --ink: #292826;
  --muted: #6E6B67;
  --border: #ECEAE7;
  --green: #9A5B4A;
  --green-soft: #FAF6F4;
  --red: #A86D58;
  --red-soft: #FBF6F3;
  --cream: #FAFAF9;
  --shadow: 0 8px 24px rgba(32, 31, 29, 0.06);
  --sidebar: 250px;
  font-family: 'Heebo', 'Arial Hebrew', 'Noto Sans Hebrew', Arial, system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
}

* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; background: var(--bg); color: var(--ink); }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.app-shell { min-height: 100vh; }

.sidebar {
  position: fixed;
  inset: 0 0 0 auto;
  width: var(--sidebar);
  padding: 24px 18px 28px;
  background: #292826;
  color: #fff;
  overflow-y: auto;
  z-index: 20;
  direction: rtl;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px 24px; border-bottom: 1px solid rgba(255,255,255,.1); }
.brand strong { display: block; font-size: 17px; letter-spacing: .2px; }
.brand small { display: block; color: rgba(255,255,255,.54); font-size: 16px; margin-top: 1px; direction: rtl; }
.flag-mark { width: 30px; height: 30px; display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.15); flex: 0 0 auto; }
.flag-mark i:nth-child(1) { background: #466653; }
.flag-mark i:nth-child(2) { background: #FAF8F4; }
.flag-mark i:nth-child(3) { background: #A4513E; }
.primary-nav { display: grid; gap: 5px; padding: 18px 0 12px; }
.nav-link { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: rgba(255,255,255,.72); font-size: 16px; transition: .2s ease; cursor: pointer; text-align: right; }
.nav-link:hover { color: #fff; background: rgba(255,255,255,.055); }
.nav-link.is-active { color: #fff; background: rgba(255,255,255,.055); font-weight: 700; }
.nav-icon { width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; display: grid; place-items: center; color: rgba(255,255,255,.72); flex: 0 0 auto; }
.nav-icon svg, .mobile-nav-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-link.is-active .nav-icon { background: transparent; border-color: rgba(255,255,255,.24); color: #fff; }
.map-app-link { width: 40px; height: 40px; display: inline-grid; place-items: center; padding: 0; border: 1px solid var(--border); border-radius: 10px; background: #fff; box-shadow: 0 2px 8px rgba(32,31,29,.04); transition: .18s ease; }
.map-app-link:hover { transform: translateY(-1px); border-color: #D7D3CE; box-shadow: 0 5px 14px rgba(32,31,29,.07); }
.map-app-link img { width: 23px; height: 23px; display: block; object-fit: contain; }
.packing-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.packing-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.packing-card h3 { margin: 0 0 12px; font-size: 18px; }
.packing-card .checklist-item { border-top: 1px solid var(--border); }
.packing-card .checklist-item:first-of-type { border-top: 0; }
.sidebar-label { color: rgba(255,255,255,.34); font-size: 16px; text-transform: uppercase; letter-spacing: 1.2px; padding: 12px 9px 8px; }
.sidebar-days { padding-bottom: 26px; }
.day-link { display: grid; grid-template-columns: 28px 1fr; gap: 9px; align-items: center; padding: 8px 9px; border-radius: 10px; color: rgba(255,255,255,.68); }
.day-link:hover, .day-link.is-active { background: rgba(255,255,255,.07); color: #fff; }
.day-index { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; font-size: 16px; }
.day-link b { display: block; font-size: 16px; font-weight: 600; }
.day-link small { display: block; color: rgba(255,255,255,.36); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mobile-nav { display: none; }

.main-content { margin-right: var(--sidebar); margin-left: 0; min-height: 100vh; direction: rtl; }
.page { width: min(1180px, calc(100% - 64px)); margin: 0 auto; padding: 52px 0 80px; }
.page-header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
.page-header h1, .day-hero h1 { margin: 3px 0 5px; font-size: clamp(32px, 4vw, 48px); line-height: 1.02; letter-spacing: -.9px; }
.page-header p, .day-hero p { margin: 0; color: var(--muted); font-size: 16px; }
.eyebrow { display: block; color: var(--green); font-size: 16px; font-weight: 700; letter-spacing: .35px; direction: rtl; text-align: right; }
.section-block, .hub-section { margin-top: 42px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
.section-heading.compact { margin-bottom: 12px; }
.section-heading h2 { margin: 3px 0 0; font-size: 22px; letter-spacing: -.3px; }
.section-note { color: var(--muted); font-size: 16px; }
.text-link { color: var(--green); font-size: 16px; font-weight: 600; }

.overview-banner { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 22px; box-shadow: var(--shadow); }
.overview-copy { padding: 17px 12px 12px 10px; display: flex; flex-direction: column; justify-content: center; }
.status-kicker { font-size: 16px; color: var(--red); letter-spacing: .4px; font-weight: 700; direction: rtl; text-align: right; }
.overview-copy h2 { margin: 8px 0 8px; font-size: 28px; line-height: 1.1; }
.overview-copy p { margin: 0; color: var(--muted); font-size: 16px; max-width: 320px; }
.flight-countdown { display: flex; align-items: center; justify-content: space-between; gap: 22px; margin: 0 0 22px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 8px 24px rgba(41,40,38,.055); }
.flight-countdown-copy { min-width: 190px; }
.flight-countdown-copy small { display: block; color: var(--muted); font-size: 16px; margin-bottom: 2px; }
.flight-countdown-copy strong { display: block; font-size: 18px; line-height: 1.35; }
.flight-countdown-copy .flight-countdown-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 16px; font-weight: 500; }
.flight-countdown-units { display: grid; grid-template-columns: repeat(4, minmax(70px, 1fr)); gap: 8px; width: min(100%, 390px); direction: ltr; }
.flight-countdown-unit { text-align: center; padding: 9px 8px; border-radius: 12px; background: #F8F8F7; }
.flight-countdown-unit b { display: block; font-size: 22px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.flight-countdown-unit span { display: block; margin-top: 5px; color: var(--muted); font-size: 16px; direction: rtl; }
.flight-countdown.is-departed { justify-content: center; text-align: center; }
.flight-countdown.is-departed .flight-countdown-units { display: none; }
.overview-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 20px; }
.overview-meta span { padding: 7px 10px; border: 1px solid var(--border); border-radius: 999px; color: #625E58; background: var(--cream); font-size: 16px; }
.mini-map-shell, .map-card, .full-map-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.map-heading { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; background: rgba(255,255,255,.85); border-bottom: 1px solid var(--border); font-size: 16px; font-weight: 600; }
.map-heading a { color: var(--green); font-size: 16px; }
.map-heading small { font-size: 16px; color: var(--muted); font-weight: 400; }
.map-canvas { position: relative; z-index: 1; height: 370px; background: #E9E4DC; }
.map-canvas-mini { height: 410px; }
.map-canvas-large { height: 640px; }

.route-rail { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; overflow: hidden; }
.route-rail-item { position: relative; min-width: 0; text-align: center; }
.route-rail-item:not(:last-child)::before { content: ''; position: absolute; top: 13px; left: -50%; width: 100%; height: 1px; background: var(--border); }
.route-dot { position: relative; z-index: 2; width: 27px; height: 27px; display: grid; place-items: center; margin: 0 auto 9px; border-radius: 50%; background: var(--surface); border: 1px solid var(--green); color: var(--green); font-size: 16px; font-weight: 700; }
.route-rail-item:nth-child(6) .route-dot { border-color: var(--red); color: var(--red); }
.route-rail strong { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.route-rail small { display: block; color: var(--muted); font-size: 16px; margin-top: 2px; }
.days-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.day-card { position: relative; min-height: 142px; padding: 17px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; transition: .2s ease; }
.day-card:hover { transform: translateY(-2px); border-color: #D7CFC5; box-shadow: var(--shadow); }
.day-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.day-pill { padding: 4px 8px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-size: 16px; font-weight: 700; }
.date-label { color: var(--muted); font-size: 16px; }
.day-card h3 { margin: 14px 0 2px; font-size: 16px; }
.day-card p { margin: 0; color: var(--muted); font-size: 16px; }
.card-arrow { position: absolute; left: 16px; bottom: 13px; color: #918A82; font-size: 17px; }
.inline-tags { display: flex; gap: 5px; margin-top: 11px; }
.inline-tags span, .muted-chip { display: inline-flex; padding: 4px 7px; border-radius: 7px; background: var(--surface-2); color: #6B655F; font-size: 16px; }

.overview-route-intro { margin: -7px 0 15px; color: var(--muted); font-size: 16px; }
.overview-days-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.overview-day-row { min-width: 0; min-height: 58px; display: grid; grid-template-columns: 88px 150px minmax(0, 1fr) 24px; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); transition: background .2s ease; }
.overview-day-row:last-child { border-bottom: 0; }
.overview-day-row:hover { background: var(--cream); }
.overview-day-index { color: var(--green); font-size: 16px; font-weight: 700; }
.overview-day-date { color: var(--muted); font-size: 16px; white-space: nowrap; }
.overview-day-point { min-width: 0; font-size: 16px; font-weight: 650; line-height: 1.35; }
.overview-day-point .ltr { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.overview-day-arrow { color: #918A82; font-size: 18px; }

.itinerary-list { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
.itinerary-row { display: grid; grid-template-columns: 94px 1.3fr 1fr 24px; align-items: center; gap: 16px; min-height: 83px; padding: 12px 18px; border-bottom: 1px solid var(--border); transition: background .2s ease; }
.itinerary-row:last-child { border-bottom: 0; }
.itinerary-row:hover { background: var(--cream); }
.itinerary-date { display: flex; align-items: center; gap: 9px; direction: ltr; }
.itinerary-date strong { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--green-soft); color: var(--green); }
.itinerary-date span { color: var(--muted); font-size: 16px; direction: rtl; }
.itinerary-main h3 { margin: 0; font-size: 16px; }
.itinerary-main p { margin: 2px 0 0; color: var(--muted); font-size: 16px; }
.itinerary-highlights { display: flex; flex-wrap: wrap; gap: 5px; }
.itinerary-arrow { color: #918A82; }
.return-strip { display: flex; align-items: center; gap: 13px; margin-top: 12px; padding: 15px 18px; border-radius: 14px; border: 1px dashed #D7CFC5; color: #6B655F; }
.return-strip strong { display: block; font-size: 16px; }
.return-strip small { display: block; margin-top: 2px; color: var(--muted); font-size: 16px; }
.return-date { direction: ltr; padding: 5px 8px; border-radius: 7px; background: var(--red-soft); color: var(--red); font-size: 16px; font-weight: 700; }

.day-breadcrumb { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 16px; margin-bottom: 25px; direction: rtl; }
.day-breadcrumb a { color: var(--green); }
.day-hero { position: relative; display: flex; justify-content: space-between; align-items: end; min-height: 120px; padding: 4px 0 22px; border-bottom: 1px solid var(--border); overflow: hidden; }
.day-hero h1 { font-size: clamp(34px, 4vw, 50px); }
.day-number-watermark { position: absolute; left: 0; bottom: -26px; font-size: 116px; line-height: 1; font-weight: 700; color: rgba(164,81,62,.07); direction: ltr; }
.day-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 15px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.day-summary > div { padding: 12px 15px; border-left: 1px solid var(--border); }
.day-summary > div:last-child { border-left: 0; }
.day-summary small { display: block; color: var(--muted); font-size: 16px; }
.day-summary strong { display: block; margin-top: 2px; font-size: 16px; }
.empty-summary { display: flex; align-items: center; gap: 9px; padding: 12px 15px; color: var(--muted); }
.empty-summary span { color: var(--ink); font-size: 16px; font-weight: 600; }
.empty-summary small { font-size: 16px; }
.day-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); gap: 22px; margin-top: 32px; align-items: start; }
.sticky-card { position: sticky; top: 22px; }
.timeline { position: relative; display: grid; gap: 14px; }
.timeline::before { content: ''; position: absolute; right: 15px; top: 22px; bottom: 22px; width: 1px; background: var(--border); }
.timeline-stop { position: relative; display: grid; grid-template-columns: 31px 1fr; gap: 12px; align-items: start; }
.stop-number { position: relative; z-index: 2; width: 31px; height: 31px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); border: 1px solid var(--green); color: var(--green); font-size: 16px; font-weight: 700; }
.timeline-stop.is-placeholder .stop-number { border-color: #C8C2BA; color: #918D87; }
.stop-card { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; overflow: hidden; }
.stop-card-main { position: relative; padding: 16px; }
.stop-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.stop-meta span { padding: 3px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); font-size: 16px; }
.stop-card h3 { margin: 0; padding-left: 80px; font-size: 16px; }
.status-badge { display: inline-flex; align-items: center; min-height: 23px; padding: 0 8px; border-radius: 999px; font-size: 16px; font-weight: 700; white-space: nowrap; }
.stop-card-main > .status-badge { position: absolute; left: 15px; top: 16px; }
.status-booked { background: var(--green-soft); color: var(--green); }
.status-must { background: var(--green-soft); color: var(--green); }
.status-to-book { background: var(--red-soft); color: var(--red); }
.status-considering, .status-planning, .status-optional { background: #EFEAE1; color: #6B655F; }
details { border-top: 1px solid var(--border); }
details summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 16px; color: var(--green); font-size: 16px; font-weight: 600; }
details summary::-webkit-details-marker { display: none; }
details[open] summary > span { transform: rotate(45deg); }
.stop-details { padding: 0 16px 14px; }
.detail-row { display: grid; grid-template-columns: 80px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid #E7E1D8; font-size: 16px; }
.detail-row > span { color: var(--muted); }
.detail-links { display: flex; gap: 8px; padding-top: 9px; }
.detail-links a { color: var(--green); font-size: 16px; font-weight: 600; direction: ltr; }

.full-map-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) 310px; gap: 18px; align-items: start; }
.map-route-list { background: var(--surface); border: 1px solid var(--border); border-radius: 17px; padding: 18px; }
.map-route-list h2 { margin: 3px 0 17px; font-size: 20px; }
.map-route-item, .map-route-return { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding-bottom: 17px; }
.map-route-item::after { content: ''; position: absolute; right: 13px; top: 29px; bottom: 2px; width: 1px; background: var(--border); }
.map-route-item > span, .map-route-return > span { position: relative; z-index: 1; width: 27px; height: 27px; display: grid; place-items: center; border: 1px solid var(--green); border-radius: 50%; color: var(--green); font-size: 16px; background: var(--surface); }
.map-route-return > span { border-color: var(--red); color: var(--red); }
.map-route-item strong, .map-route-return strong { display: block; font-size: 16px; }
.map-route-item small, .map-route-return small { display: block; margin-top: 2px; color: var(--muted); font-size: 16px; }

.hub-section { padding-top: 5px; }
.hub-grid.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.hub-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.hub-card-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 17px; border-bottom: 1px solid var(--border); }
.hub-card-head h3 { margin: 3px 0 0; font-size: 16px; }
.hub-card-head p { margin: 2px 0 0; color: var(--muted); font-size: 16px; }
.info-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
.info-grid > div { padding: 11px 15px; border-bottom: 1px solid #E7E3DC; border-left: 1px solid #E7E3DC; min-height: 56px; }
.info-grid > div:nth-child(even) { border-left: 0; }
.info-grid > div:nth-last-child(-n+2) { border-bottom: 0; }
.info-grid small { display: block; color: var(--muted); font-size: 16px; }
.info-grid strong { display: block; margin-top: 2px; font-size: 16px; font-weight: 500; }
.pending-value { color: #918A82; font-size: 16px; font-weight: 400; }
.car-summary { display: flex; align-items: center; gap: 14px; padding: 18px; }
.car-icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 13px; background: var(--green-soft); color: var(--green); font-size: 16px; font-weight: 700; direction: ltr; }
.car-summary h3 { margin: 0; font-size: 16px; }
.car-summary p { margin: 3px 0 0; color: var(--muted); font-size: 16px; }
.placeholder-band { padding: 10px 18px; background: var(--cream); border-top: 1px solid var(--border); }
.accordion-list { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.info-accordion { border-top: 0; border-bottom: 1px solid var(--border); }
.info-accordion:last-child { border-bottom: 0; }
.info-accordion summary { padding: 13px 16px; color: var(--ink); }
.info-accordion summary > div strong { display: block; font-size: 16px; }
.info-accordion summary > div small { display: block; margin-top: 2px; color: var(--muted); font-size: 16px; font-weight: 400; }
.accordion-body { padding: 0 16px 14px; color: var(--muted); font-size: 16px; }
.status-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.status-summary > div { padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.status-summary strong { display: block; font-size: 22px; line-height: 1; }
.status-summary span { display: block; color: var(--muted); font-size: 16px; margin-top: 4px; direction: ltr; }
.reservation-list { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.reservation-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 15px; border-bottom: 1px solid var(--border); }
.reservation-row:last-child { border-bottom: 0; }
.reservation-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.category-chip { flex: 0 0 auto; min-width: 51px; padding: 4px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); text-align: center; direction: ltr; font-size: 16px; }
.reservation-name strong { display: block; font-size: 16px; }
.reservation-name small { display: block; color: var(--muted); font-size: 16px; }
.checklist-card { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.checklist-item { display: flex; align-items: center; gap: 9px; padding: 12px 15px; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); font-size: 16px; cursor: pointer; }
.checklist-item:nth-child(even) { border-left: 0; }
.checklist-item:nth-last-child(-n+2) { border-bottom: 0; }
.checklist-item input { position: absolute; opacity: 0; pointer-events: none; }
.custom-check { width: 18px; height: 18px; border: 1px solid #BBB5AC; border-radius: 6px; display: grid; place-items: center; }

function parseRoute(hash = '') {
  const normalized = hash || '#/overview'
  const dayMatch = normalized.match(/^#\/day\/(day-\d+)$/)
  if (dayMatch) return { page: 'day', dayId: dayMatch[1] }

  const topRoutes = {
    '#/overview': 'overview',
    '#/itinerary': 'itinerary',
    '#/map': 'map',
    '#/hub': 'hub',
    '#/packing': 'packing',
    '#/tasks': 'tasks',
  }
  return { page: topRoutes[normalized] ?? 'overview' }
}



const esc = (value = '') => String(value)
  .replaceAll('&', '&amp;')
  .replaceAll('<', '&lt;')
  .replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;')
  .replaceAll("'", '&#039;')

const ltr = (value) => `<span class="ltr" dir="ltr">${esc(value)}</span>`
const hasHebrew = (value = '') => /[\u0590-\u05FF]/.test(String(value))
const smartText = (value) => hasHebrew(value) ? esc(value) : ltr(value)
const active = (current, route) => current === route ? 'is-active' : ''

const navItems = [
  ['#/overview', 'ראשי', 'ראשי', 'home'],
  ['#/itinerary', 'מסלול', 'מסלול', 'itinerary'],
  ['#/map', 'מפה מלאה', 'מפה', 'map'],
  ['#/hub', 'מרכז הטיול', 'מרכז', 'hub'],
  ['#/packing', 'רשימת ציוד', 'ציוד', 'packing'],
  ['#/tasks', 'משימות', 'משימות', 'tasks'],
]

function overviewDayCard(day) {

        <div class="itinerary-highlights">${day.highlights.length ? day.highlights.map((h) => `<span>${smartText(h)}</span>`).join('') : '<span class="muted-chip">התכנון יתווסף</span>'}</div>
        <span class="itinerary-arrow">←</span>
      </a>`).join('')}
    </div>

function dailySummary(day) {
  const facts = []
  if (day.startBase) facts.push(['יוצאים מ־', day.startBase])
  if (day.drivingTime) facts.push(['נהיגה', day.drivingTime])
  const destinationCount = day.stops.filter((stop) => !['planning', 'drive', 'transfer'].includes(stop.type)).length
  if (destinationCount) facts.push(['עצירות', `${destinationCount}`])
  if (day.walking) facts.push(['הליכה', day.walking])
  if (day.overnight) facts.push(['לינה', day.overnight])

  if (!facts.length) return `<div class="day-summary empty-summary"><span>היום עדיין בתכנון</span><small>נוסיף כאן זמני נסיעה, עצירות ולינה כשייסגרו.</small></div>`
  return `<div class="day-summary">${facts.map(([label, value]) => `<div><small>${esc(label)}</small><strong>${smartText(value)}</strong></div>`).join('')}</div>`
}

function stopTypeLabel(type) {
  return { attraction: 'אטרקציה', activity: 'פעילות', food: 'אוכל', hotel: 'לינה', parking: 'חניה', car: 'רכב', ferry: 'מעבורת', cablecar: 'רכבל', drive: 'נסיעה', transfer: 'מעבר', planning: 'בתכנון' }[type] ?? type
}

function detailsContent(stop) {
  const details = stop.details ?? {}
  const rows = []
  if (details.address) rows.push(['כתובת', ltr(details.address)])
  if (details.openingHours) rows.push(['שעות', esc(details.openingHours)])
  if (details.price) rows.push(['מחיר', esc(details.price)])
  if (details.parking) rows.push(['חניה', esc(details.parking)])
  if (details.reservation) rows.push(['הזמנה', esc(details.reservation)])
  if (details.notes) rows.push(['הערות', esc(details.notes)])
  const links = []
  if (details.website) links.push(`<a href="${esc(details.website)}" target="_blank" rel="noreferrer">אתר ↗</a>`)
  const coordinates = stop.coordinates
  if (coordinates?.lat != null && coordinates?.lng != null) {
    const latLng = `${coordinates.lat},${coordinates.lng}`
    const googleMapsUrl = details.googleMapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(latLng)}`
    const wazeUrl = details.wazeUrl || `https://www.waze.com/ul?ll=${encodeURIComponent(latLng)}&navigate=yes`
    links.push(`<a class="map-app-link" href="${esc(googleMapsUrl)}" target="_blank" rel="noreferrer" aria-label="פתיחה ב-Google Maps" title="Google Maps"><img src="https://cdn.simpleicons.org/googlemaps/4285F4" alt="" /></a>`)
    links.push(`<a class="map-app-link" href="${esc(wazeUrl)}" target="_blank" rel="noreferrer" aria-label="פתיחה ב-Waze" title="Waze"><img src="https://cdn.simpleicons.org/waze/33CCFF" alt="" /></a>`)
  } else if (details.googleMapsUrl) {
    links.push(`<a class="map-app-link" href="${esc(details.googleMapsUrl)}" target="_blank" rel="noreferrer" aria-label="פתיחה ב-Google Maps" title="Google Maps"><img src="https://cdn.simpleicons.org/googlemaps/4285F4" alt="" /></a>`)
  }
  return `<div class="stop-details">${rows.map(([label, value]) => `<div class="detail-row"><span>${label}</span><div>${value}</div></div>`).join('')}${links.length ? `<div class="detail-links">${links.join('')}</div>` : ''}</div>`
}

function stopNameMarkup(stop) {
  if (stop.nameDirection === 'rtl') return esc(stop.name)
  if (stop.nameDirection === 'ltr') return ltr(stop.name)
  return smartText(stop.name)
}

function driveCard(stop) {
  const note = stop.details?.notes ? `<small>${esc(stop.details.notes)}</small>` : ''
  const routeLabel = stop.type === 'transfer' ? 'מעבר' : 'נסיעה'
  return `<article class="timeline-drive">
    <div class="drive-icon" aria-hidden="true">↙</div>
    <div class="drive-copy">
      <span>${routeLabel}${stop.time ? ` · ${esc(stop.time)}` : ''}</span>
      <strong>${stopNameMarkup(stop)}</strong>
      <b>${esc(stop.duration ?? '')}</b>
      ${note}
    </div>
  </article>`
}

function stopCard(stop, index) {
  const hasDetails = Boolean(stop.coordinates) || (stop.details && Object.values(stop.details).some(Boolean))
  return `<article class="timeline-stop ${stop.type === 'planning' ? 'is-placeholder' : ''}">
    <div class="stop-number">${index}</div>
    <div class="stop-card">
      <div class="stop-card-main">
        <div class="stop-meta"><span>${esc(stop.time ?? 'ללא שעה קבועה')}</span><span>${esc(stopTypeLabel(stop.type))}</span>${stop.duration ? `<span>${esc(stop.duration)}</span>` : ''}</div>
        <h3>${stopNameMarkup(stop)}</h3>
        <span class="status-badge status-${esc(stop.reservationStatus)}">${esc(statusLabel(stop.reservationStatus))}</span>
      </div>
      ${hasDetails ? `<details><summary>פרטים נוספים <span>＋</span></summary>${detailsContent(stop)}</details>` : ''}
    </div>
  </article>`
}

function renderTimeline(stops) {
  let destinationIndex = 0
  return stops.map((stop) => {
    if (['drive', 'transfer'].includes(stop.type)) return driveCard(stop)
    destinationIndex += 1
    return stopCard(stop, destinationIndex)
  }).join('')
}


function areaOptionLinks(option) {
  const details = option.details ?? {}
  const links = []
  if (details.website) {
    links.push(`<a href="${esc(details.website)}" target="_blank" rel="noreferrer">אתר ↗</a>`)
  }
  if (details.address) {
    const encodedAddress = encodeURIComponent(details.address)
    const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedAddress}`
    const wazeUrl = `https://www.waze.com/ul?q=${encodedAddress}&navigate=yes`
    links.push(`<a class="map-app-link" href="${esc(googleMapsUrl)}" target="_blank" rel="noreferrer" aria-label="פתיחה ב-Google Maps" title="Google Maps"><img src="https://cdn.simpleicons.org/googlemaps/4285F4" alt="" /></a>`)

      text: [day.title, day.area, day.routeLabel, day.startBase, day.overnight, ...(day.highlights || [])].filter(Boolean).join(' '),

    day.stops.forEach((stop) => {

      const details = stop.details || {}
      items.push({
        title: stop.name,
        meta: `יום ${day.number} · ${formatDate(day.date)} · ${stopTypeLabel(stop.type)}`,
        href: `#/day/${day.id}`,
        text: [stop.name, stop.time, stop.duration, details.address, details.notes, details.reservation].filter(Boolean).join(' '),
      })
    })
  })

  trip.days.forEach((day) => {
    ;(day.areaOptions || []).forEach((option) => {
      const details = option.details || {}
      items.push({
        title: option.name,
        meta: `יום ${day.number} · אפשרויות באזור · ${option.category}`,
        href: `#/day/${day.id}`,
        text: [option.name, option.category, option.description, details.address, details.notes].filter(Boolean).join(' '),
      })
    })
  })
  ;(trip.reservations || []).forEach((item) => items.push({
    title: item.name,
    meta: 'מרכז הטיול · הזמנות ותכנון',
    href: '#/hub',
    text: [item.name, item.category, item.date, item.status].filter(Boolean).join(' '),
  }))
  ;(trip.checklist || []).forEach((item) => items.push({
    title: item.label,
    meta: 'מרכז הטיול · לפני שטסים',

  ;(trip.packing || []).forEach((group) => group.items.forEach((item) => items.push({
    title: item,
    meta: `רשימת ציוד · ${group.title}`,
    href: '#/packing',

  return items

const ITALY_GREEN = '#466653'
const ITALY_RED = '#B97952'
const INK = '#292826'
let leafletLoadPromise = null

function fallbackMarkup(points, compact = false) {
  if (!points?.length) {
    return `<div class="map-fallback map-fallback-empty"><span class="map-fallback-icon">MAP</span><strong>המפה תתמלא עם המסלול</strong><small>נוסיף נקודות כשנסגור את התכנון היומי.</small></div>`
  }
  return `<div class="map-fallback ${compact ? 'is-compact' : ''}">
    <div class="fallback-route-line"></div>
    ${points.map((point, index) => `${point.href ? `<a class="fallback-point" href="${point.href}">` : '<div class="fallback-point">'}<span>${compact ? '•' : (point.dayNumber ?? index + 1)}</span><div><strong dir="${point.direction ?? 'ltr'}">${point.name}</strong><small>${point.label ?? ''}</small></div>${point.href ? '</a>' : '</div>'}`).join('')}
  </div>`
}

function mapPointsForElement(element, trip) {
  const kind = element.dataset.mapKind
  if (kind === 'overview') {
    return { points: trip.routeAnchors, compact: true, routeStart: trip.routeStart ?? null, routePath: trip.routePath ?? null, highlightLast: false }
  }
  if (kind === 'full') {
    return { points: trip.routeAnchors, compact: false, routeStart: trip.routeStart ?? null, routePath: trip.routePath ?? null, highlightLast: false }
  }
  if (kind === 'day') {
    const config = dailyMapRoutes[element.dataset.dayId]
    if (!config) return { points: [], compact: false, routePath: [], highlightLast: false }
    return { points: config.points, compact: false, routePath: config.routePath, highlightLast: false }
  }
  return { points: [], compact: false, highlightLast: false }
}

function numberedIcon(L, number, color = ITALY_GREEN) {
  return L.divIcon({
    className: 'trip-map-marker-wrap',
    html: `<div class="trip-map-marker" style="--marker-color:${color}">${number}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15],
  })
}

function dotIcon(L, color = ITALY_GREEN) {
  return L.divIcon({
    className: 'trip-map-marker-wrap',
    html: `<div class="trip-map-dot" style="--marker-color:${color}"></div>`,
    iconSize: [13, 13],
    iconAnchor: [6.5, 6.5],
  })
}

function createLeafletMap(element, points, { compact = false, showLine = true, routeStart = null, routePath = null, highlightLast = false } = {}) {
  const L = window.L
  if (element._leaflet_id) return
  const map = L.map(element, {
    zoomControl: !compact,
    scrollWheelZoom: false,
    attributionControl: !compact,
  })

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap',
  }).addTo(map)

  const markerLatLngs = points.map((point) => [point.lat, point.lng])
  const explicitRouteLatLngs = (routePath ?? []).map((point) => [point.lat, point.lng])
  const lineLatLngs = explicitRouteLatLngs.length
    ? explicitRouteLatLngs
    : routeStart
      ? [[routeStart.lat, routeStart.lng], ...markerLatLngs]
      : markerLatLngs

  points.forEach((point, index) => {
    const markerColor = highlightLast && index === points.length - 1 && points.length > 1 ? ITALY_RED : ITALY_GREEN
    const markerIcon = compact ? dotIcon(L, markerColor) : numberedIcon(L, point.dayNumber ?? index + 1, markerColor)
    const marker = L.marker([point.lat, point.lng], { icon: markerIcon }).addTo(map)
    marker.bindPopup(`<div class="map-popup"><strong dir="${point.direction ?? 'ltr'}">${point.name}</strong>${point.label ? `<span>${point.label}</span>` : ''}${point.href ? `<a href="${point.href}">ליום המלא ←</a>` : ''}</div>`)
  })

  if (showLine && lineLatLngs.length > 1) {
    L.polyline(lineLatLngs, { color: INK, weight: compact ? 2 : 2.5, opacity: 0.48, dashArray: '7 8' }).addTo(map)
  }

  if (lineLatLngs.length === 1) map.setView(lineLatLngs[0], 11)
  else map.fitBounds(lineLatLngs, { padding: compact ? [18, 18] : [36, 36] })
}

function initMapFallbacks(trip) {
  document.querySelectorAll('[data-map-kind]').forEach((element) => {
    const { points, compact } = mapPointsForElement(element, trip)
    element.innerHTML = fallbackMarkup(points, compact)
  })
}

function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L)
  if (leafletLoadPromise) return leafletLoadPromise
  leafletLoadPromise = new Promise((resolve, reject) => {
    const css = document.createElement('link')
    css.rel = 'stylesheet'
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'
    document.head.append(css)

    const script = document.createElement('script')
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
    script.async = true
    script.onload = () => resolve(window.L)
    script.onerror = () => reject(new Error('Leaflet could not load'))
    document.head.append(script)
    window.setTimeout(() => reject(new Error('Leaflet load timeout')), 3500)
  })
  return leafletLoadPromise
}

async function enhanceMapsWithLeaflet(trip) {
  try {
    await loadLeaflet()
  } catch {
    return
  }

  document.querySelectorAll('[data-map-kind]').forEach((element) => {
    const { points, compact, routeStart, routePath, highlightLast } = mapPointsForElement(element, trip)
    if (!points.length || !document.body.contains(element)) return
    try {
      element.innerHTML = ''
      createLeafletMap(element, points, { compact, routeStart, routePath, highlightLast })
    } catch (error) {
      console.warn('Map unavailable, keeping fallback.', error)
      element.innerHTML = fallbackMarkup(points, compact)
    }
  })
}



function initGlobalSearch(trip) {
  const overlay = document.querySelector('#site-search-overlay')
  const input = document.querySelector('#site-search-input')
  const results = document.querySelector('#site-search-results')
  if (!overlay || !input || !results) return
  const index = buildSearchIndex(trip)

  const closeSearch = () => {
    overlay.classList.remove('is-open')
    overlay.setAttribute('aria-hidden', 'true')
    input.value = ''
    results.innerHTML = '<div class="search-empty">אפשר לחפש למשל: Seceda, ספא, Riva או Monza</div>'
  }
  const openSearch = () => {
    overlay.classList.add('is-open')
    overlay.setAttribute('aria-hidden', 'false')
    window.setTimeout(() => input.focus(), 20)
  }

  document.querySelectorAll('.search-trigger').forEach((button) => button.addEventListener('click', openSearch))
  overlay.querySelector('.search-close')?.addEventListener('click', closeSearch)
  overlay.addEventListener('click', (event) => { if (event.target === overlay) closeSearch() })
  overlay.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && overlay.classList.contains('is-open')) closeSearch()
  })

  input.addEventListener('input', () => {
    const query = input.value.trim().toLocaleLowerCase('he-IL')
    if (!query) {
      results.innerHTML = '<div class="search-empty">אפשר לחפש למשל: Seceda, ספא, Riva או Monza</div>'
      return
    }
    const matches = index.filter((item) => `${item.title} ${item.meta} ${item.text}`.toLocaleLowerCase('he-IL').includes(query)).slice(0, 20)
    if (!matches.length) {
      results.innerHTML = `<div class="search-empty">לא נמצאו תוצאות עבור “${esc(input.value)}”</div>`
      return
    }
    results.innerHTML = matches.map((item) => `<a class="search-result" href="${item.href}">
      <div><strong>${smartText(item.title)}</strong><small>${esc(item.meta)}</small></div><span class="search-result-arrow">←</span>
    </a>`).join('')
    results.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeSearch))
  })
}


function initMobileUtilityMenu() {
  const trigger = document.querySelector('.mobile-menu-trigger')
  const menu = document.querySelector('#mobile-more-menu')
  if (!trigger || !menu) return
  const close = () => {
    menu.classList.remove('is-open')
    menu.setAttribute('aria-hidden', 'true')
    trigger.setAttribute('aria-expanded', 'false')
  }
  trigger.addEventListener('click', (event) => {
    event.stopPropagation()
    const willOpen = !menu.classList.contains('is-open')
    if (!willOpen) return close()
    menu.classList.add('is-open')
    menu.setAttribute('aria-hidden', 'false')
    trigger.setAttribute('aria-expanded', 'true')
    window.setTimeout(() => document.addEventListener('click', close, { once: true }), 0)
  })
  menu.addEventListener('click', (event) => event.stopPropagation())
  menu.querySelectorAll('a').forEach((link) => link.addEventListener('click', close))
}

let countdownTimer = null
function initFlightCountdown() {
  if (countdownTimer) { window.clearInterval(countdownTimer); countdownTimer = null }
  const root = document.querySelector('#flight-countdown')
  if (!root) return
  const target = new Date('2026-10-02T11:00:00+03:00').getTime()
  const fields = {
    days: root.querySelector('[data-countdown="days"]'),
    hours: root.querySelector('[data-countdown="hours"]'),
    minutes: root.querySelector('[data-countdown="minutes"]'),
    seconds: root.querySelector('[data-countdown="seconds"]'),
  }
  const update = () => {
    const remaining = target - Date.now()
    if (remaining <= 0) {
      root.classList.add('is-departed')
      root.querySelector('.flight-countdown-copy small').textContent = 'הגיע הרגע'
      root.querySelector('.flight-countdown-copy strong').textContent = 'יוצאים לאיטליה ✈︎'
      root.querySelector('.flight-countdown-meta').textContent = 'נסיעה טובה!'
      if (countdownTimer) { window.clearInterval(countdownTimer); countdownTimer = null }
      return
    }
    const totalSeconds = Math.floor(remaining / 1000)
    const days = Math.floor(totalSeconds / 86400)
    const hours = Math.floor((totalSeconds % 86400) / 3600)
    const minutes = Math.floor((totalSeconds % 3600) / 60)
    const seconds = totalSeconds % 60
    fields.days.textContent = String(days)
    fields.hours.textContent = String(hours).padStart(2, '0')
    fields.minutes.textContent = String(minutes).padStart(2, '0')
    fields.seconds.textContent = String(seconds).padStart(2, '0')
  }
  update()
  countdownTimer = window.setInterval(update, 1000)
}

const app = document.querySelector('#app')

function pageForRoute(route) {
  switch (route.page) {
    case 'itinerary': return renderDayPage(trip, trip.days[0])
    case 'map': return renderFullMapPage(trip)
    case 'hub': return renderTravelHubPage(trip)
    case 'packing': return renderPackingPage(trip)
    case 'tasks': return renderTasksPage(trip)
    case 'day': {
      const day = getDayById(trip, route.dayId)
      return day ? renderDayPage(trip, day) : renderDayPage(trip, trip.days[0])
    }
    case 'overview':
    default: return renderOverviewPage(trip)
  }
}

function renderApp() {
  const hash = window.location.hash || '#/overview'
  const route = parseRoute(hash)
  app.innerHTML = renderShell({ trip, currentHash: hash, content: pageForRoute(route) })
  document.title = route.page === 'day'
    ? `${getDayById(trip, route.dayId)?.title ?? 'המסלול'} · צפון איטליה`
    : `צפון איטליה · ${route.page === 'hub' ? 'מרכז הטיול' : route.page === 'packing' ? 'רשימת ציוד' : route.page === 'tasks' ? 'משימות' : route.page === 'map' ? 'מפה מלאה' : route.page === 'itinerary' ? 'המסלול' : 'ראשי'}`

  window.scrollTo({ top: 0, behavior: 'auto' })
  initMapFallbacks(trip)
  initGlobalSearch(trip)
  initMobileUtilityMenu()
  initFlightCountdown()
  enhanceMapsWithLeaflet(trip)
}

window.addEventListener('hashchange', renderApp)
window.addEventListener('DOMContentLoaded', renderApp)

if (!window.location.hash) window.location.hash = '#/overview'

</script>
