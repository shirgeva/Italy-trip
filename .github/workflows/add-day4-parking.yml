name: Add Day 4 Ortisei parking reference

on:
  push:
    paths:
      - '.github/workflows/add-day4-parking.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Day 4 parking reference
        shell: bash
        run: |
          python3 -c "import base64; from pathlib import Path; p=Path('index.html'); s=p.read_text(); import sys; sys.exit(0) if \"id: 'garage-central-ortisei'\" in s else None; pairs=[('',''),('ZnVuY3Rpb24gcmVuZGVyRGF5QWxlcnRzKGRheSkgew==',''),('ICAgICR7cmVuZGVyQXJlYU9wdGlvbnMoZGF5KX0KICA8L3NlY3Rpb24+YA==','ICAgICR7cmVuZGVyQXJlYU9wdGlvbnMoZGF5KX0KICAgICR7cmVuZGVyUGFya2luZ09wdGlvbnMoZGF5KX0KICA8L3NlY3Rpb24+YA==')];
for a,b in pairs:
 old=base64.b64decode(a).decode(); new=base64.b64decode(b).decode();
 if old not in s: raise SystemExit('Patch anchor not found');
 s=s.replace(old,new,1);
p.write_text(s)"
      - name: Commit update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "shirgeva"
          git config user.email "shirgeva11@gmail.com"
          git rm .github/workflows/add-day4-parking.yml
          git add index.html
          git commit -m "Add Ortisei parking reference to Day 4"
          git push
