name: Fix sidebar icon mapping

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "${navItems.map(([href, label, icon]) => `<a class=\"nav-link ${active(currentTop, href)}\" href=\"${href}\"><span class=\"nav-icon\" aria-hidden=\"true\">${navIcon(icon)}</span><span>${label}</span></a>`).join('')}"
          new = "${navItems.map(([href, label, , icon]) => `<a class=\"nav-link ${active(currentTop, href)}\" href=\"${href}\"><span class=\"nav-icon\" aria-hidden=\"true\">${navIcon(icon)}</span><span>${label}</span></a>`).join('')}"
          assert old in s, 'old sidebar mapping not found'
          s = s.replace(old, new, 1)
          assert new in s
          for forbidden in ['PWHSNG','927630','9738285720SI','1176714','Eyal Shalom','Shir Geva Shalom']:
              assert forbidden not in s
          p.write_text(s, encoding='utf-8')
          print('sidebar icon mapping verified')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script type="module">\n?(.*?)\n?</script>', s, re.S)
          assert m
          Path('/tmp/site.mjs').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/site.mjs
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-sidebar-icons.yml
          git add index.html
          git commit -m "Restore navigation icons"
          git push origin HEAD:main
