name: Update Day 5 with booked Loacker workshop

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-day5-loacker.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Day 5 itinerary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          # Loacker Heinfels map point.
          replace_once(
              "  postResidence: { lat: 46.732145, lng: 12.282422 },\n  braies:",
              "  postResidence: { lat: 46.732145, lng: 12.282422 },\n  loackerHeinfels: { lat: 46.749141, lng: 12.449250 },\n  braies:",
              'Loacker coordinate insertion',
          )

          # Day 5 map: hotel first, then Austria workshop, then return to San Candido.
          map_pattern = re.compile(r"  'day-5': \{\n    points: \[.*?\n  \},\n  'day-6': \{", re.S)
          map_replacement = """  'day-5': {
    points: [
      { name: 'ecHo Apartments & SPA · Bressanone', label: '07:15–07:30 · צ׳ק־אאוט ויציאה', ...coords.echoBressanone },
      { name: 'Alpe di Siusi / Compatsch', label: '≈08:00–08:15 · P2 מוזמן · חניה והתארגנות', ...coords.alpeSiusi },
      { name: 'Gostner Schwaige', label: '≈09:00–09:30/09:45 · יעד הליכה מתוכנן וגמיש', ...coords.gostnerSchwaige },
      { name: 'Alpe di Siusi / Compatsch', label: '≈10:15/10:30–11:00 · תצפיות וזמן נוף גמיש', ...coords.alpeSiusi },
      { name: 'Passo Gardena · עצירת נוף', label: '≈11:45–12:00 · 20–30 דק׳', ...coords.passoGardena },
      { name: 'Post Residence - Home of Memories - Dolomites', label: 'הגעה ≈13:30–14:15 · check-in ב־15:00 + פריקת מזוודות', ...coords.postResidence },
      { name: 'Loacker Café Heinfels · Austria', label: '≈15:55–16:00 הגעה · Pastry Workshop 16:15–17:15 · הוזמן', ...coords.loackerHeinfels },
      { name: 'Post Residence - Home of Memories - Dolomites', label: 'חזרה בערב אחרי Loacker · לילה 1 מתוך 2', ...coords.postResidence },
    ],
    routePath: [coords.echoBressanone, coords.alpeSiusi, coords.gostnerSchwaige, coords.alpeSiusi, coords.passoGardena, coords.postResidence, coords.loackerHeinfels, coords.postResidence],
    routeModes: ['DRIVING', 'WALKING', 'WALKING', 'DRIVING', 'DRIVING', 'DRIVING', 'DRIVING'],
  },
  'day-6': {"""
          text, count = map_pattern.subn(map_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Day 5 map replacement: expected 1 match, found {count}')

          # Overall trip route now includes the short Austria out-and-back.
          replace_once(
              "San Candido / Post Residence → Pozza di Fassa / DOLOMITI EXCLUSIVE YOUR MOUNTAIN SUITE",
              "San Candido / Post Residence → Heinfels / Loacker → San Candido → Pozza di Fassa / DOLOMITI EXCLUSIVE YOUR MOUNTAIN SUITE",
              'Route summary',
          )
          replace_once(
              "    coords.alpeSiusi,\n    coords.postResidence,\n    coords.treCime,",
              "    coords.alpeSiusi,\n    coords.postResidence,\n    coords.loackerHeinfels,\n    coords.postResidence,\n    coords.treCime,",
              'Overall route path',
          )
          replace_once(
              "{ id: 'day-5-map', dayNumber: 5, href: '#/day/day-5', name: 'Alpe di Siusi', label: 'יום 5 · 6.10', ...coords.alpeSiusi },",
              "{ id: 'day-5-map', dayNumber: 5, href: '#/day/day-5', name: 'Alpe di Siusi + Loacker Heinfels', label: 'יום 5 · 6.10', ...coords.alpeSiusi },",
              'Day 5 route anchor',
          )

          day5_pattern = re.compile(r"    \{\n      id: 'day-5', number: 5, date: '2026-10-06',.*?\n    \},\n    \{\n      id: 'day-6'", re.S)
          day5_replacement = """    {
      id: 'day-5', number: 5, date: '2026-10-06',
      startBase: 'ecHo Apartments & SPA, Bressanone',
      title: 'Alpe di Siusi → Passo Gardena → San Candido → Loacker Heinfels',
      overviewPoint: 'Alpe di Siusi + Loacker Heinfels',
      area: 'Alpe di Siusi / San Candido / Heinfels, Austria',
      routeLabel: 'ecHo Apartments & SPA, Bressanone → Alpe di Siusi / Compatsch → Passo Gardena → Post Residence, San Candido → Loacker Café Heinfels → Post Residence',
      overnight: 'Post Residence - Home of Memories - Dolomites · San Candido · לילה 1 מתוך 2',
      drivingTime: 'כ־3:05–3:50 שעות נהיגה נטו · כולל הנסיעה הקצרה לאוסטריה וחזרה',
      walking: '1–1.5 שעות בפועל',
      highlights: ['Alpe di Siusi + Gostner Schwaige', 'Passo Gardena', 'Loacker Pastry Workshop · 16:15 · הוזמן'],
      areaOptions: [],
      criticalAlert: 'Alpe di Siusi: לעבור את מחסום San Valentino עד 09:00 ולהגיע ל־P2 עד 09:30. Loacker: סדנה מוזמנת ב־16:15 — יעד הגעה 15:55–16:00.',
      dayNotes: [
        'אחרי Passo Gardena ממשיכים קודם ל־Post Residence. עושים check-in ב־15:00, נכנסים לחדר ופורקים את המזוודות, ורק אחר כך יוצאים עם הרכב ל־Heinfels שבאוסטריה.',
        'המעבר לאוסטריה עם הרכב נבדק ואושר מבחינת חברת ההשכרה והכיסוי הרלוונטי. הנסיעה ל־Loacker היא על הכביש הרגיל לכיוון Heinfels ולא דורשת Vignette אוסטרית.',
      ],
      stops: [
        place({ id: 'day5-checkout-luggage', type: 'hotel', name: 'ecHo Apartments & SPA · צ׳ק־אאוט + מזוודות לרכב', time: '07:15–07:30', status: 'booked', coordinates: coords.echoBressanone, details: { openingHours: 'Check-out עד 10:00', address: 'Via Millan 14/A, 39042 Bressanone (BZ), Italy', notes: 'לוקחים את המזוודות איתנו ומשאירים אותן מוסתרות בתא המטען בזמן Alpe di Siusi, כדי להמשיך ישירות מזרחה ל־San Candido.' } }),
        drive('drive-echo-alpe', 'ecHo Apartments & SPA, Bressanone → Alpe di Siusi / Compatsch', 'כ־35–45 דקות', '07:15–07:30 יציאה', { notes: 'יעד הגעה: בערך 08:00–08:15. חשוב לעבור את מחסום San Valentino עד 09:00 ולהגיע ל־P2 עד 09:30.' }),
        place({ id: 'alpe-cable-up', type: 'parking', name: 'Alpe di Siusi / Compatsch · P2 Parking', description: 'Alpe di Siusi היא רמה אלפינית עצומה של כרי דשא ומרעה המוקפים בהרי הדולומיטים. Compatsch היא נקודת ההגעה והחניה שממנה מתחילים את ההליכה.', time: '≈08:00–08:15', duration: '≈08:15–08:30 התארגנות להליכה', status: 'booked', coordinates: coords.alpeSiusi, details: { price: '€30 לרכב ליום · הוזמן ושולם', openingHours: 'הזמנה ל־6.10.2026 · חניה 05:00–23:00 · מחסום San Valentino עד 09:00 · P2 עד 09:30 · ירידה מותרת בכל שעה', parking: 'P2 Compatsch · מקום חניה לבחירה חופשית בתוך P2 · כניסה אחת בלבד', reservation: 'P2 Compatsch הוזמן ל־06.10.2026', notes: 'ההזמנה כוללת את אישור העלייה עם הרכב ל־Alpe di Siusi. אחרי שיוצאים מהאזור אי אפשר להיכנס שוב באותה הזמנה. אפשר לרדת מההר בכל שעה; צריך לעזוב את החניון עד 23:00.' } }),
        transfer('walk-compatsch-gostner-day5', 'Compatsch → Gostner Schwaige', 'כ־30–45 דקות ברגל', '≈08:30–09:00/09:15', { notes: 'הליכה קלה ונופית דרך כרי הדשא של Alpe di Siusi. היעד נותן לנו כיוון ברור לבוקר, אבל הקצב והמרחק נשארים גמישים.' }),
        place({ id: 'gostner-schwaige-day5', type: 'food', name: 'Gostner Schwaige · מתוכנן / גמיש', description: 'בקתת הרים ומחלבה מקומית בתוך Alpe di Siusi שמייצרת גבינות, יוגורט ומוצרי חלב מחלב אלפיני. זה יעד ההליכה המועדף שלנו, אבל העצירה נשארת גמישה.', time: '≈09:00/09:15–09:30/09:45', duration: 'כ־30–45 דקות', status: 'planned', coordinates: coords.gostnerSchwaige, details: { openingHours: '6.10.2026 · מאומת: 09:00–17:30 מדי יום · מטבח חם 11:00–16:30', price: 'אין דמי כניסה · משלמים רק על אוכל / שתייה / מוצרים', address: 'Saltria 13, 39040 Alpe di Siusi / Seiser Alm, Italy', notes: 'מחלבת הרים / בקתה אלפינית עם מוצרי חלב מקומיים בייצור עצמי. אנחנו מגיעים לפני פתיחת המטבח החם ולכן לא בונים על ארוחה מלאה. זה יעד ההליכה המועדף, אבל אפשר לקצר אם נרצה יותר זמן נוף סביב Compatsch.', website: 'https://www.seiseralm.it/en/info-service/current-information/information-a-z/E1B51F35362CDDEA97FFD47F074A6BEC-p-cheese-dairy-gostner-mountain-hut.html' } }),
        transfer('walk-gostner-compatsch-day5', 'Gostner Schwaige → Compatsch', 'כ־30–45 דקות ברגל', '≈09:30/09:45–10:15/10:30', { notes: 'חזרה רגועה באותו אזור לכיוון Compatsch.' }),
        place({ id: 'alpe-siusi-scenic-time-day5', type: 'activity', name: 'Alpe di Siusi · זמן נוף גמיש סביב Compatsch', time: '≈10:15/10:30–11:00', duration: 'עד היציאה סביב 11:00', status: 'planned', coordinates: coords.alpeSiusi, details: { notes: 'זמן לתמונות, תצפיות, סטיות קצרות מהשביל והנאה מכרי הדשא. בגלל הסדנה הקבועה ב־16:15, יעד היציאה נשאר סביב 11:00 ולא מושכים את הבוקר בלי סוף.' } }),
        drive('drive-alpe-gardena', 'Alpe di Siusi / Compatsch → Passo Gardena · דרך Val Gardena', 'כ־45–55 דקות', '≈11:00–11:45/11:55', { notes: 'ממשיכים ישירות מזרחה דרך אזור Val Gardena; אין חזרה ל־Bressanone.' }),
        place({ id: 'passo-gardena', type: 'activity', name: 'Passo Gardena · עצירת נוף', description: 'מעבר הרים גבוה בין Val Gardena ל־Alta Badia, עם נוף דרמטי של רכסי Sella והדולומיטים. אצלנו זו עצירת תצפית קצרה בדרך ל־San Candido.', time: '≈11:45–12:00', duration: '20–30 דקות', status: 'planned', coordinates: coords.passoGardena, details: { notes: 'עצירה קצרה לנוף בלבד; לא מסלול הליכה. שומרים את היום זורם כדי להגיע בנחת ל־San Candido לפני הסדנה.' } }),
        drive('drive-gardena-sancandido', 'Passo Gardena → Post Residence, San Candido', 'כ־1:15–1:30 שעות', 'אחרי עצירת הנוף', { notes: 'כביש הררי דרך Alta Badia / Val Pusteria. הגעה משוערת למלון בערך 13:30–14:15 בהתאם לקצב ולתנועה.' }),
        place({ id: 'post-residence-day5', type: 'hotel', name: 'Post Residence - Home of Memories - Dolomites · הגעה', time: 'הגעה משוערת ≈13:30–14:15', status: 'booked', coordinates: coords.postResidence, details: { address: 'Via dei Benedettini 11/C, 39038 Innichen / S. Candido, Italy', parking: 'חניה פרטית מוזמנת · €10 ליום', openingHours: 'Check-in 15:00–23:00 · check-out 07:30–10:00', notes: 'הוזמן ל־6–8.10, 2 לילות · Apartment Love. אם מגיעים לפני 15:00, נשארים קרוב למלון / אוכלים משהו קצר ולא יוצאים לפעילות רחוקה. המטרה היא להיות מוכנים ל־check-in ב־15:00.' } }),
        place({ id: 'post-checkin-before-loacker-day5', type: 'hotel', name: 'Post Residence · צ׳ק־אין + פריקת מזוודות', time: '15:00–≈15:30/15:35', duration: 'כ־30–35 דקות', status: 'booked', coordinates: coords.postResidence, details: { notes: 'נכנסים קודם לחדר, פורקים את המזוודות ומתארגנים. רק אחרי שסיימנו יוצאים עם הרכב לאוסטריה. יעד יציאה: בערך 15:35–15:40.' } }),
        drive('drive-post-loacker-day5', 'Post Residence, San Candido → Loacker Café Heinfels, Austria', 'כ־15–20 דקות · כ־14 ק״מ', '≈15:35–15:40 → ≈15:55–16:00', { notes: 'נסיעה קצרה מ־San Candido מזרחה לכיוון Heinfels דרך הכביש הרגיל. מעבר הגבול עם הרכב אושר מבחינת ההשכרה והכיסוי הרלוונטי. אין צורך ב־Vignette במסלול הזה. יעד הגעה 15–20 דקות לפני תחילת הסדנה.' }),
        place({ id: 'loacker-workshop-day5', type: 'activity', name: 'Loacker Pastry Workshop · Heinfels', description: 'סדנה אינטראקטיבית של Loacker שבה מכינים וופל אישי. זו פעילות מוזמנת וקבועה בשעה 16:15 במתחם Loacker World of Goodness שב־Heinfels, אוסטריה.', time: '16:15–17:15', duration: 'שעה', status: 'booked', coordinates: coords.loackerHeinfels, details: { openingHours: 'Pastry Workshop: 16:15–17:15 · Loacker Café / Brandstore: 09:00–18:00', price: '€10 לאדם · €20 לזוג · שולם', address: 'Panzendorf 196, 9919 Heinfels, Austria', parking: 'חניה גדולה מול המתחם', reservation: 'הוזמן ושולם · 2 מבוגרים · English · Order BPQ7B · הכרטיסים / QR נמצאים באימייל Loacker', notes: 'להגיע סביב 15:55–16:00. בתחילת הסדנה מציגים למדריך את אישור ההזמנה / הכרטיסים מהאימייל, עדיף דיגיטלית. לצורך שליפה מהירה במייל: “Payment received for your order: BPQ7B”. באתר שמרנו את מספר ההזמנה בלבד — לא את קודי ה־QR הסודיים.', website: 'https://www.loacker.com/int/en/experience-loacker/world-of-goodness.html' } }),
        place({ id: 'loacker-after-workshop-day5', type: 'food', name: 'Loacker Café + Brandstore · זמן חופשי אחרי הסדנה', description: 'אחרי הסדנה אפשר להישאר עוד קצת לקפה, קינוח או קניות בחנות המותג עם מגוון מוצרי Loacker.', time: '17:15–≈17:45/18:00', duration: '30–45 דקות · גמיש', status: 'planned', coordinates: coords.loackerHeinfels, details: { openingHours: 'Loacker Café Heinfels: כל יום 09:00–18:00', price: 'כניסה חופשית · משלמים לפי קנייה / הזמנה', address: 'Panzendorf 196, 9919 Heinfels, Austria', notes: 'לא חייבים להישאר עד הסגירה. אם אנחנו עייפים חוזרים ישר אחרי הסדנה; אם כיף לנו, יש זמן להסתובב ולקנות עד בערך 18:00.' } }),
        drive('drive-loacker-post-day5', 'Loacker Café Heinfels → Post Residence, San Candido', 'כ־15–20 דקות · כ־14 ק״מ', '≈17:45–18:00 יציאה → ≈18:05–18:20', { notes: 'חוזרים באותו כביש מערבה לאיטליה ולמלון. אחרי החזרה הרכב נשאר בחניה של המלון.' }),
        place({ id: 'post-residence-night1-day5', type: 'hotel', name: 'Post Residence - Home of Memories - Dolomites · לילה 1 מתוך 2', time: 'ערב', status: 'booked', coordinates: coords.postResidence, details: { address: 'Via dei Benedettini 11/C, 39038 Innichen / S. Candido, Italy', parking: 'חניה פרטית מוזמנת · €10 ליום', notes: 'אחרי Loacker חוזרים למלון. משם אפשר לצאת ברגל למרכז San Candido לארוחת ערב.' } }),
      ],
    },
    {
      id: 'day-6'"""
          text, count = day5_pattern.subn(day5_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Day 5 itinerary replacement: expected 1 match, found {count}')

          # Add the confirmed activity to the central reservation list.
          reservation_marker = "    { id: 'tre-cime', name: 'Tre Cime · parking / access', category: 'Activity', date: '2026-10-07', status: 'booked' },"
          loacker_reservation = "    { id: 'loacker-workshop-day5', name: 'Loacker Pastry Workshop · Heinfels · 16:15', category: 'Activity', date: '2026-10-06', status: 'booked' },\n"
          if loacker_reservation.strip() not in text:
              replace_once(reservation_marker, loacker_reservation + reservation_marker, 'Reservation list insertion')

          # Guardrails: no QR/token secrets and all key booking facts must be present.
          required = [
              "Loacker Pastry Workshop · Heinfels",
              "16:15–17:15",
              "Order BPQ7B",
              "2 מבוגרים",
              "€20 לזוג · שולם",
              "coords.loackerHeinfels",
              "Post Residence · צ׳ק־אין + פריקת מזוודות",
              "P2 Compatsch הוזמן",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Missing expected Day 5 content: {token}')

          path.write_text(text)
          print('Day 5 Loacker itinerary patched successfully.')
          PY

      - name: Verify site regressions
        run: |
          python3 scripts/test_google_maps_migration.py
          python3 scripts/test_content_clarity_hebrew.py
          python3 scripts/test_live_weather.py
          python3 scripts/test_day_alert_hierarchy.py
          python3 scripts/test_daily_accommodation_summary.py
          python3 scripts/test_carezza_loacker_update.py
          python3 scripts/test_day_tabs_visual_reset.py
          python3 scripts/test_monza_milan_day_update.py
          python3 scripts/test_packing_checklist.py

      - name: Commit Day 5 update
        run: |
          git config user.name "Italy Trip Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add booked Loacker workshop to Day 5"
          git push origin HEAD:main

      - name: Configure Google Maps key for deploy
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          key = os.environ.get('GOOGLE_MAPS_API_KEY', '').strip()
          text = text.replace('__GOOGLE_MAPS_API_KEY__', key)
          path.write_text(text)
          print('Google Maps key configured for deploy.' if key else 'No Google Maps key configured; Leaflet fallback remains active.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
