name: Day 3 itinerary update
on: [push]

permissions:
  contents: write

jobs:
  update-day3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply day 3 update
        shell: bash
        run: python3 scripts/update_day3.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "shirgeva"
          git config user.email "shirgeva11@gmail.com"
          git add index.html
          git commit -m "Update day 3 Dolomites transfer stops"
          git push
