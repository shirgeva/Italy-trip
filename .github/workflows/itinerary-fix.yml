name: One-time Val di Fassa itinerary correction

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/itinerary-fix.yml"

permissions:
  contents: write

jobs:
  fix-itinerary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply itinerary correction
        run: python scripts/fix_val_di_fassa_days.py

      - name: Commit corrected itinerary and clean up helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/itinerary-fix.yml
          rm scripts/fix_val_di_fassa_days.py
          git add index.html .github/workflows/itinerary-fix.yml scripts/fix_val_di_fassa_days.py
          git commit -m "Correct Val di Fassa and spa day order"
          git push
