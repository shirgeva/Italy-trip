            margin: -8px 0 14px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.55;
          }
          .area-options-list {
            overflow: hidden;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(32,31,29,.04);
          }
          .area-option {
            border-top: 0;
            border-bottom: 1px solid var(--border);
