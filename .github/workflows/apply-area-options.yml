          RENDERERS = r'''
          function areaOptionLinks(option) {
            const details = option.details ?? {}
            const links = []
            if (details.website) {
              links.push(`<a href="${esc(details.website)}" target="_blank" rel="noreferrer">אתר ↗</a>`)
            }
            if (details.address) {
              const encodedAddress = encodeURIComponent(details.address)
              const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedAddress}`
              const wazeUrl = `https://www.waze.com/ul?q=${encodedAddress}&navigate=yes`
              links.push(`<a class="map-app-link" href="${esc(googleMapsUrl)}" target="_blank" rel="noreferrer" aria-label="פתיחה ב-Google Maps" title="Google Maps"><img src="https://cdn.simpleicons.org/googlemaps/4285F4" alt="" /></a>`)
              links.push(`<a class="map-app-link" href="${esc(wazeUrl)}" target="_blank" rel="noreferrer" aria-label="פתיחה ב-Waze" title="Waze"><img src="https://cdn.simpleicons.org/waze/33CCFF" alt="" /></a>`)
            }
            return links.length ? `<div class="detail-links">${links.join('')}</div>` : ''
          }

          function renderAreaOption(option) {
            const details = option.details ?? {}
            const rows = []
            if (details.openingHours) rows.push(['שעות', esc(details.openingHours)])
            if (details.price) rows.push(['מחיר', esc(details.price)])
            if (details.address) rows.push(['כתובת', ltr(details.address)])
            if (details.notes) rows.push(['הערה', esc(details.notes)])
            return `<details class="area-option">
              <summary>
                <div class="area-option-summary"><strong>${ltr(option.name)}</strong><small class="area-option-category">${esc(option.category)}</small></div>
                <span class="area-option-toggle" aria-hidden="true">＋</span>
              </summary>
              <div class="area-option-body">
                ${option.description ? `<p class="area-option-description">${esc(option.description)}</p>` : ''}
                ${rows.map(([label, value]) => `<div class="detail-row"><span>${label}</span><div>${value}</div></div>`).join('')}
                ${areaOptionLinks(option)}
              </div>
            </details>`
          }

          function renderAreaOptions(day) {
            const options = day.areaOptions ?? []
            if (!options.length) return ''
            return `<section class="area-options-section" aria-label="אפשרויות באזור">
              <div class="section-heading compact">
                <div><span class="eyebrow">אם נשאר זמן</span><h2>אפשרויות באזור</h2></div>
                <span class="section-note">${options.length} מקומות ששמרנו</span>
              </div>
              <p class="area-options-intro">לא חלק מהמסלול המתוכנן — רק דברים שכדאי לזכור אם נשאר זמן ומתאים באותו רגע. השעות שלא פורסמו במיוחד ל־2026 ייבדקו שוב סמוך לטיול.</p>
              <div class="area-options-list">${options.map(renderAreaOption).join('')}</div>
            </section>`
          }

          '''

