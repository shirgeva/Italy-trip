                const details = option.details || {}
                items.push({
                  title: option.name,
                  meta: `יום ${day.number} · אפשרויות באזור · ${option.category}`,
                  href: `#/day/${day.id}`,
                  text: [option.name, option.category, option.description, details.address, details.notes].filter(Boolean).join(' '),
                })
              })
            })
          '''


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise ValueError(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)


          def transform(source: str) -> str:
              if SENTINEL in source:
                  raise ValueError('area options already applied')

              out = source

              forbidden = ['PWHSNG', '927630', '9738285720SI', '1176714', 'Eyal Shalom', 'Shir Geva Shalom']
              for value in forbidden:
                  if value in out:
                      raise ValueError(f'public source contains sensitive value before update: {value}')

              out = replace_once(out, '\n</style>', CSS + '\n</style>', 'css')

              for anchor, replacement in DAY_BLOCKS.items():
                  out = replace_once(out, anchor, replacement, f'day block {anchor[:45]!r}')

              out = replace_once(out, 'function renderDayAlerts(day) {', RENDERERS + 'function renderDayAlerts(day) {', 'renderers')

              day_layout_end = '''      </aside>\n    </div>\n  </section>`\n}\n\nfunction renderFullMapPage(trip) {'''
              day_layout_replacement = '''      </aside>\n    </div>\n    ${renderAreaOptions(day)}\n  </section>`\n}\n\nfunction renderFullMapPage(trip) {'''
              out = replace_once(out, day_layout_end, day_layout_replacement, 'day page area-options insertion')

              search_anchor = '  ;(trip.reservations || []).forEach((item) => items.push({'
              out = replace_once(out, search_anchor, SEARCH_BLOCK + search_anchor, 'search index')

              out = replace_once(
                  out,
                  'שעה משוערת בלבד; תתעדכן אחרי בחירת המלון ותיקון שעת החזרת הרכב.',
                  'שעה משוערת בלבד; תתעדכן אחרי בחירת המלון.',
                  'stale rental-return note',
              )

              required = [
                  SENTINEL,
                  'function renderAreaOptions(day)',
                  '${renderAreaOptions(day)}',
                  'day.areaOptions || []',
                  'Limonaia del Castèl',
                  'Acetaia Giusti - Boutique Milano Duomo',
                  'Gianduiotto · Caffarel / Venchi',
              ]
              for value in required:
                  if value not in out:
                      raise ValueError(f'missing expected output: {value}')
              for value in forbidden:
                  if value in out:
                      raise ValueError(f'public source contains sensitive value after update: {value}')
              if 'ותיקון שעת החזרת הרכב' in out:
                  raise ValueError('stale rental-return warning remained')

              return out


          if __name__ == '__main__':
              import argparse
              from pathlib import Path

              parser = argparse.ArgumentParser()
              parser.add_argument('path')
              args = parser.parse_args()
              path = Path(args.path)
              path.write_text(transform(path.read_text(encoding='utf-8')), encoding='utf-8')
          PY
          python /tmp/apply_area_options.py index.html

      - name: Validate public site and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'function renderAreaOptions(day)',
              'Limonaia del Castèl',
              'Acetaia Giusti - Boutique Milano Duomo',
              'Gelateria Umberto 1934 Milano',
              'day.areaOptions || []',
          ]
          forbidden = ['PWHSNG', '927630', '9738285720SI', '1176714', 'Eyal Shalom', 'Shir Geva Shalom', 'ותיקון שעת החזרת הרכב']
          for value in required:
              assert value in s, value
          for value in forbidden:
              assert value not in s, value
          m = re.search(r'<script type="module">\n?(.*?)\n?</script>', s, re.S)
          assert m, 'module script missing'
          Path('/tmp/site.mjs').write_text(m.group(1), encoding='utf-8')
          print('site validation passed')
          PY
          node --check /tmp/site.mjs
          git diff --check

      - name: Commit exact updated source and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-area-options.yml
          git add index.html
          git commit -m "Add daily area options"
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload final site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy final site
        id: deployment
        uses: actions/deploy-pages@v5
