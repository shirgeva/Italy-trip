name: Day tab color contrast

on:
  push:
    paths:
      - '.github/workflows/day-tab-color-contrast.yml'

permissions:
  contents: write

jobs:
  update-tabs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update tab colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace(
              ".day-tab:nth-child(4n + 1), .day-tab:nth-child(4n + 2) { background: #F6F0EA; border-color: #E8DDD3; color: #655E58; }",
              ".day-tab:nth-child(4n + 1), .day-tab:nth-child(4n + 2) { background: #F3E8DC; border-color: #DFCDBC; color: #5F5954; }",
              1,
          )
          s = s.replace(
              ".day-tab:nth-child(4n + 3), .day-tab:nth-child(4n + 4) { background: #EFE5E2; border-color: #E0D2CD; color: #655E58; }",
              ".day-tab:nth-child(4n + 3), .day-tab:nth-child(4n + 4) { background: #E1ECE4; border-color: #C9D9CE; color: #536058; }",
              1,
          )
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "shirgeva"
          git config user.email "shirgeva11@gmail.com"
          git rm .github/workflows/day-tab-color-contrast.yml
          git add index.html
          git commit -m "Increase contrast between lodging day groups"
          git push
