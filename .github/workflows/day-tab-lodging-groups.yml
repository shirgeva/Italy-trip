name: Day tab lodging groups
on: [push]

permissions:
  contents: write

jobs:
  update-tabs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch day tab colors
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = ".day-tab { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 16px; font-weight: 650; transition: .2s ease; }\n.day-tab:hover { border-color: #CFC7BE; color: var(--ink); }\n.day-tab.is-active { background: var(--green); border-color: var(--green); color: #fff; }"
          new = ".day-tab { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 16px; font-weight: 650; transition: .2s ease; }\n.day-tab:nth-child(4n + 1), .day-tab:nth-child(4n + 2) { background: #F6F0EA; border-color: #E8DDD3; color: #655E58; }\n.day-tab:nth-child(4n + 3), .day-tab:nth-child(4n + 4) { background: #EFE5E2; border-color: #E0D2CD; color: #655E58; }\n.day-tab:hover { border-color: #CFC7BE; color: var(--ink); filter: brightness(.985); }\n.day-tab.is-active { background: var(--green); border-color: var(--green); color: #fff; filter: none; }"
          if old not in s:
              raise SystemExit("day-tab CSS block not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "shirgeva"
          git config user.email "shirgeva11@gmail.com"
          git rm .github/workflows/day-tab-lodging-groups.yml
          git add index.html
          git commit -m "Add subtle lodging grouping to day tabs"
          git push
