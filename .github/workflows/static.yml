# Temporary Day 5 logistics patch + deploy
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Day 5 route and luggage logistics if needed
        shell: bash
        run: |
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCnAgPSBQYXRoKCJpbmRleC5odG1sIikKcyA9IHAucmVhZF90ZXh0KCkKCmlmICJpZDogJ2RheTUtY2hlY2tvdXQtbHVnZ2FnZSciIGluIHM6CiAgICByYWlzZSBTeXN0ZW1FeGl0KDApCgpzdGFydCA9IHMu
' | base64 -d | python3
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "shirgeva"
          git config user.email "shirgeva11@gmail.com"
          git add index.html
          git commit -m "Clarify Day 5 route and luggage logistics"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
