# Temporary relaxed Val di Fassa patch + deploy
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch relaxed Oct 8-9 Val di Fassa plan if needed
        shell: bash
        run: |
          python3 scripts/patch_relaxed_valdifassa_oct8_9.py
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "shirgeva"
          git config user.email "shirgeva11@gmail.com"
          git add index.html
          git commit -m "Relax Oct 8-9 around hotel and Val San Nicolo"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
