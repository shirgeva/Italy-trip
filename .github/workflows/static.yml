# Temporary workflow to patch Day 4 and deploy
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Day 4 parking reference if needed
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if "id: 'garage-central-ortisei'" not in s:
              pairs = [
                  ('', ''),
                  ('ZnVuY3Rpb24gcmVuZGVyRGF5QWxlcnRzKGRheSkgew==', ''),
                  ('ICAgICR7cmVuZGVyQXJlYU9wdGlvbnMoZGF5KX0KICA8L3NlY3Rpb24+YA==', 'ICAgICR7cmVuZGVyQXJlYU9wdGlvbnMoZGF5KX0KICAgICR7cmVuZGVyUGFya2luZ09wdGlvbnMoZGF5KX0KICA8L3NlY3Rpb24+YA=='),
              ]
              for old_b64, new_b64 in pairs:
                  old = base64.b64decode(old_b64).decode()
                  new = base64.b64decode(new_b64).decode()
                  if old not in s:
                      raise SystemExit('Patch anchor not found')
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          if ! git diff --quiet -- index.html; then
            git config user.name "shirgeva"
            git config user.email "shirgeva11@gmail.com"
            git add index.html
            git commit -m "Add Ortisei parking reference to Day 4"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
