# Temporary Bressanone-base patch + deploy
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Bressanone base and Days 3-5 if needed
        shell: bash
        run: |
          python3 scripts/patch_bressanone_base_days3_5.py
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "shirgeva"
          git config user.email "shirgeva11@gmail.com"
          git add index.html
          git commit -m "Use Bressanone base for Days 3-5"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
