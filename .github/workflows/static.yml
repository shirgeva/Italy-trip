# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  patch-day4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Day 4 source if needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if "id: 'val-gardena-wood-carving'" in s:
              raise SystemExit(0)
          old = "      highlights: ['Seceda'],\n      stops: ["
          lines = [
              "      highlights: ['Seceda'],",
              "      areaOptions: [",
              "        {",
              "          id: 'val-gardena-wood-carving',",
              "          name: 'Val Gardena Active – Wood Carving Class',",
              "          category: 'סדנת גילוף עץ · אופציה',",
              "          description: 'סדנת גילוף עץ מסורתית של Val Gardena. לומדים טכניקות בסיסיות של גילוף בעץ ויוצרים תבליט קטן.',",
              "          details: {",
              "            duration: 'כ־3 שעות',",
              "            price: 'כ־€90 לאדם',",
              "            availability: 'התאריך האחרון שפורסם כרגע הוא 2.10.2026; עוקבים אחרי פתיחת תאריכים נוספים סביב 5.10.',",
              "            notes: 'Monitoring availability — if a suitable date opens for October 5, consider adding this after Seceda and replacing part of the free afternoon in Ortisei.',",
              "          },",
              "        },",
              "      ],",
              "      stops: [",
          ]
          new = "\n".join(lines)
          if old not in s:
              raise SystemExit('Day 4 insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name shirgeva
          git config user.email shirgeva11@gmail.com
          git add index.html
          git commit -m "Add optional Val Gardena wood carving class to Day 4"
          git push

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
