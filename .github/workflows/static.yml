# Temporary workflow for the daily lodging-summary update.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply daily lodging summary update
        shell: bash
        run: |
          python3 scripts/patch_daily_accommodation_summary.py
          python3 scripts/fix_daily_lodging_mapping.py
          python3 scripts/remove_stale_day_summary_css.py
          if ! git diff --quiet -- index.html; then
            git config user.name "shirgeva"
            git config user.email "shirgeva11@gmail.com"
            git add index.html
            git commit -m "Simplify daily lodging summary"
            git push
          fi

      - name: Verify site regressions
        run: |
          python3 scripts/test_google_maps_migration.py
          python3 scripts/test_daily_accommodation_summary.py

      - name: Configure Google Maps key for deploy
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          key = os.environ.get('GOOGLE_MAPS_API_KEY', '').strip()
          text = text.replace('__GOOGLE_MAPS_API_KEY__', key)
          path.write_text(text)
          print('Google Maps key configured for deploy.' if key else 'No Google Maps key configured; Leaflet fallback remains active.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
